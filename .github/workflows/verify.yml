name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26, macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests
        run: swift test
      - name: Standalone regression checks
        run: python3 Scripts/test-regressions.py
      - name: Build and verify app bundle
        run: python3 Scripts/build-app.py
      - name: Check command interface without starting HID
        run: '"artifacts/WCH Touch Driver.app/Contents/MacOS/MacXeneonEdgeTouchDriver" --help'
