name: Hardware compatibility report
description: Tell us about your touchscreen. Unknown models and technical details are welcome.
title: "[Compatibility]: "
labels:
  - compatibility
  - hardware
body:
  - type: markdown
    attributes:
      value: |
        Help other owners find their monitor in the [monitor list](https://github.com/cryptoteatime/wch-touchscreen-macos/blob/main/docs/monitors.md). Working and non-working results are useful; you can also ask about an untested model. Fill in what you know and leave optional details blank.

        Do not post serial numbers, order details, USB location IDs, or a full system report. [The compatibility guide](https://github.com/cryptoteatime/wch-touchscreen-macos/blob/main/docs/compatibility.md) explains how to check your monitor without Terminal.

  - type: input
    id: product-name
    attributes:
      label: Which monitor do you have?
      description: Copy the product name or public product link from the box, label, or store listing. If you cannot identify it, describe the screen and say "unknown."
      placeholder: Prechen HD-123 12.3-inch touchscreen, or a public product link
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model number (if known)
      placeholder: HD-123
    validations:
      required: false

  - type: input
    id: listing
    attributes:
      label: Public product link or product code (optional)
      description: A SKU, UPC/EAN barcode, or Amazon ASIN can help identify the variant. Include its source; do not include your order or device serial number.
      placeholder: Manufacturer product page, SKU, UPC/EAN, or ASIN
    validations:
      required: false

  - type: input
    id: usb-controller
    attributes:
      label: Touch hardware details (optional)
      description: If you checked System Information, copy the USB device name, Vendor ID, and Product ID. It is fine to leave this blank. Do not include a serial number or location ID.
      placeholder: wch.cn TouchScreen — Vendor ID 0x27c0, Product ID 0x0859
    validations:
      required: false

  - type: input
    id: resolution
    attributes:
      label: Screen size and resolution (if known)
      description: Use the box or product description. These details are optional.
      placeholder: 12.3 inches, 1920 × 720
    validations:
      required: false

  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
      description: Find these in Apple menu → About This Mac. Copy the model and macOS version only, without the serial number. Say "unknown" if you cannot check.
      placeholder: Mac mini, macOS 15.x
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: How is the monitor connected?
      description: Choose all that apply, or choose "Not sure" and describe the cables below.
      multiple: true
      options:
        - Direct USB-C
        - USB-C or Thunderbolt hub/dock
        - USB-A for touch plus HDMI for video
        - USB-C for touch plus HDMI for video
        - Other
        - Not sure
    validations:
      required: false

  - type: input
    id: connection-details
    attributes:
      label: Cables, adapter, or dock (optional)
      description: Describe both ends of the cables and any adapter or dock. Mention DisplayLink only if you know it is being used.
      placeholder: Mac USB-C → dock → HDMI, plus a USB cable for touch
    validations:
      required: false

  - type: input
    id: driver-version
    attributes:
      label: WCH version or commit (if known)
      description: Include the release number or commit you installed. If you have not installed WCH, say so.
    validations:
      required: false

  - type: input
    id: test-date
    attributes:
      label: When did you test? (optional)
      placeholder: Today, or YYYY-MM-DD
    validations:
      required: false

  - type: dropdown
    id: overall-result
    attributes:
      label: What happened?
      options:
        - The features I tried worked
        - Some features worked
        - Touch did not work
        - I have not tested WCH yet
    validations:
      required: true

  - type: dropdown
    id: operating-mode
    attributes:
      label: Mac display mode
      options:
        - Laptop lid open
        - Laptop lid closed
        - Desktop Mac (external displays only)
    validations:
      required: false

  - type: input
    id: power
    attributes:
      label: Monitor power source
      placeholder: Powered from Mac USB-C, separate charger, or powered dock
    validations:
      required: false

  - type: textarea
    id: results
    attributes:
      label: What did you try?
      description: Describe what worked or failed on each screen. Mark anything you have not tried as "untested"; you do not need to test everything. If you have not installed WCH, explain what you want to check.
      placeholder: |
        Panels tested:
        Pairing targets and taps on the correct screen:
        Portrait/landscape orientation:
        Scrolling, dragging, double-click, and right-click:
        Brightness:
        Unplug/reconnect:
        Sleep/wake:
        Full Mac restart:
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      description: Mention differences between panels or listing variants. Crop or cover serial numbers and order details in any photos.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed controller serial numbers, USB location IDs, usernames, and other private machine identifiers.
          required: true
